spring:
  datasource:
    url: jdbc:mariadb://127.0.0.1:3306/sistema_distribuido_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: true
    consumer:
      auto-offset-reset: earliest
      group-id: pagamentos-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.erik.sistema_distribuido_pagamentos.domain"
        spring.json.value.default.type: "com.erik.sistema_distribuido_pagamentos.domain.Pagamento"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
gemini:
  api-key: ${GOOGLE_API_KEY}